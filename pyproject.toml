[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spillway"
version = "0.1.0"
description = "Find secrets that spilled onto your machine: shell history, .env files, dotfiles, git configs. Stdlib-only, no network."
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
spillway = "spillway:main"

[tool.setuptools]
py-modules = ["spillway"]
